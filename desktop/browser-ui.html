<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self';style-src 'self' 'unsafe-inline';script-src 'self'"><meta name="color-scheme" content="dark"><title>Chrome Pro</title><style>:root{--bg:#202124;--tab:#303136;--tabActive:#3a3b40;--hover:#424348;--text:#f1f3f4;--muted:#9aa0a6;--address:#303136;--line:#45464b;--accent:#8ab4f8;--green:#34a853}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);user-select:none}button,input{font:inherit}.browser-shell{height:104px;background:linear-gradient(180deg,#2a2b2f,#25262a);border-bottom:1px solid #111214;box-shadow:0 2px 10px #0008;padding:5px 8px 0;position:relative}.top{height:30px;display:flex;align-items:center;gap:5px}.brand{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:#fff;padding:0 8px}.brand-mark{width:19px;height:19px;border-radius:6px;display:grid;place-items:center;background:linear-gradient(135deg,#4285f4,#8b5cf6);font-size:10px}.pro{font-size:8px;letter-spacing:.8px;color:#9fc4ff;background:#31517e55;border:1px solid #5177aa66;padding:2px 5px;border-radius:5px}.nav-top{display:flex;align-items:center;gap:2px;margin-left:3px;padding:0 4px}.tool{width:34px;height:32px;border:0;background:transparent;color:#cfd2d6;border-radius:50%;font-size:21px;cursor:pointer;display:grid;place-items:center}.tool:hover:not(:disabled){background:var(--hover);color:#fff}.tool:active:not(:disabled){transform:scale(.94)}.tool:disabled{opacity:.28;cursor:default}.nav-top .tool{font-size:25px}.nav-top .tool:first-child,.nav-top .tool:nth-child(2){font-weight:500}.tab-count{font-size:10px;color:#d2d5d8;background:#ffffff0b;border:1px solid #ffffff12;border-radius:11px;padding:4px 8px;margin-left:5px;white-space:nowrap}.privacy{margin-left:auto;font-size:9px;color:var(--muted);display:flex;align-items:center;gap:5px;padding:0 4px 0 8px}.privacy i{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block}.window-btn{width:30px;height:24px;border:0;background:transparent;color:#b9bbbf;border-radius:6px;cursor:pointer}.window-btn:hover{background:var(--hover);color:#fff}.window-btn.close-win:hover{background:#c42b3b;color:#fff}.tabs{height:35px;display:flex;align-items:stretch;gap:3px;overflow:hidden;padding:0 2px}.tab{height:35px;min-width:165px;max-width:250px;display:flex;align-items:center;gap:8px;background:var(--tab);border:1px solid transparent;border-radius:9px 9px 0 0;padding:0 7px 0 10px;color:#c9cacc;cursor:pointer}.tab:hover{background:#38393e}.tab.active{background:var(--tabActive);color:#fff;border-color:#4a4b50}.favicon{width:16px;height:16px;border-radius:5px;display:grid;place-items:center;background:#5f6368;color:#fff;font-size:8px;flex:0 0 auto}.tab-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-size:11px}.close{width:23px;height:23px;border:0;background:transparent;color:#b9bbbf;border-radius:50%;font-size:15px;cursor:pointer}.close:hover{background:#4b4c51;color:#fff}.add{width:32px;height:30px;align-self:center;border:0;background:transparent;color:#d5d7da;font-size:21px;border-radius:50%;cursor:pointer}.add:hover{background:var(--hover)}.toolbar{height:34px;display:flex;align-items:center;gap:2px;padding:0}.address-wrap{height:32px;flex:1;display:flex;align-items:center;background:var(--address);border:1px solid transparent;border-radius:18px;margin:0 6px;padding:0 7px 0 11px;box-shadow:inset 0 1px 2px #0004}.address-wrap:focus-within{background:#3b3c41;border-color:#647b9f}.security{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;color:#9aa0a6;font-size:10px;margin-right:3px;background:#ffffff08}.address{width:100%;height:28px;border:0;outline:0;background:transparent;color:#f1f3f4;font-size:12px;user-select:text}.address::placeholder{color:#9aa0a6}.address-action{width:27px;height:27px;border:0;background:transparent;color:#9aa0a6;font-size:16px;border-radius:50%;cursor:pointer}.address-action:hover{color:#fff;background:#ffffff0b}.menu{position:absolute;right:9px;top:68px;width:258px;background:#303136;border:1px solid #56585e;border-radius:12px;padding:7px;display:none;z-index:100;box-shadow:0 14px 40px #000b}.menu.show{display:block}.menu-head{padding:9px 10px 8px;font-size:11px;color:#fff;border-bottom:1px solid var(--line);margin-bottom:4px}.menu-head small{float:right;color:var(--muted);font-size:9px}.menu button{display:block;width:100%;text-align:left;background:transparent;color:#f1f3f4;border:0;padding:9px 10px;border-radius:7px;font-size:11px;cursor:pointer}.menu button:hover{background:var(--hover)}.menu kbd{float:right;color:#9aa0a6;font-size:9px;background:#ffffff08;padding:2px 5px;border-radius:4px}.menu-section{font-size:8px;color:#7f8388;padding:8px 10px 4px;text-transform:uppercase;letter-spacing:.8px}.progress{position:absolute;left:0;right:0;bottom:0;height:2px;background:transparent;overflow:hidden}.progress.loading:after{content:"";display:block;width:35%;height:100%;background:var(--accent);animation:load 1s ease-in-out infinite}@keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}</style></head><body><div class="browser-shell"><div class="top"><div class="brand"><span class="brand-mark">✦</span>Chrome Pro <span class="pro">PRO</span></div><div class="nav-top" aria-label="Page navigation"><button id="back" class="tool" title="Back (Alt+Left)" aria-label="Back">←</button><button id="forward" class="tool" title="Forward (Alt+Right)" aria-label="Forward">→</button><button id="reload" class="tool" title="Reload" aria-label="Reload">↻</button><span id="tabCount" class="tab-count" aria-live="polite">1 tab</span></div><div class="privacy"><i></i><span>Protected</span></div><button class="window-btn" title="Minimize" aria-label="Minimize">—</button><button class="window-btn" title="Maximize" aria-label="Maximize">□</button><button class="window-btn close-win" title="Close" aria-label="Close">×</button></div><div id="tabs" class="tabs" role="tablist" aria-label="Browser tabs"></div><div class="toolbar"><div class="address-wrap"><span class="security" aria-hidden="true">⌁</span><input id="address" class="address" spellcheck="false" autocomplete="off" placeholder="Search or enter web address" aria-label="Address and search"></div><button id="go" class="address-action" title="Go" aria-label="Go">→</button><button id="bookmark" class="tool" title="Bookmark this page" aria-label="Bookmark">☆</button><button id="incognito" class="tool" title="New Incognito Window" aria-label="New Incognito Window">◐</button><button id="profile" class="tool" title="New Profile" aria-label="New Profile">●</button><button id="menuBtn" class="tool" title="Chrome Pro menu" aria-label="Chrome Pro menu">⋮</button></div><div id="progress" class="progress done" aria-hidden="true"></div></div><div id="menu" class="menu" role="menu"><div class="menu-head"><b>Chrome Pro</b><small>v1.0</small></div><div class="menu-section">Your browser</div><button id="history">History <kbd>Ctrl+H</kbd></button><button id="bookmarks">Bookmarks <kbd>Ctrl+Shift+B</kbd></button><button id="downloads">Downloads</button><div class="menu-section">Privacy</div><button id="clear">Clear site data</button></div><script src="browser-ui.js"></script></body></html>
