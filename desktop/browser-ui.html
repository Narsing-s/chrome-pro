<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self';style-src 'self' 'unsafe-inline';script-src 'self'"><meta name="color-scheme" content="dark"><title>Chrome Pro</title><style>:root{--bg:#15171b;--panel:#202329;--panel2:#292c33;--tab:#25282e;--tabActive:#343841;--hover:#414650;--text:#f5f7fa;--muted:#a7adb8;--accent:#7aa2ff;--green:#42d77d;--line:#3c414b}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#111317;color:var(--text);user-select:none}button,input{font:inherit}.browser-shell{height:104px;background:linear-gradient(180deg,#22252b 0%,#1b1e23 100%);border-bottom:1px solid #0b0c0e;box-shadow:0 4px 18px #000b;padding:6px 9px 0;position:relative;z-index:9999}.top{height:30px;display:flex;align-items:center;gap:6px}.brand{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:750;color:#fff;padding:0 7px;white-space:nowrap}.brand-mark{width:20px;height:20px;border-radius:7px;display:grid;place-items:center;background:linear-gradient(135deg,#4285f4,#8b5cf6);font-size:11px;box-shadow:0 3px 12px #4285f455;animation:logoPulse 3s ease-in-out infinite}.pro{font-size:8px;letter-spacing:.8px;color:#b9d2ff;background:#31517e66;border:1px solid #6d91c966;padding:2px 5px;border-radius:5px}.nav-top{display:flex;align-items:center;gap:4px;margin-left:5px;padding:0 4px}.tool{width:34px!important;height:32px!important;min-width:34px;border:1px solid transparent!important;background:#2b2e35!important;color:#f0f3f8!important;border-radius:9px!important;font-size:20px!important;cursor:pointer;display:grid;place-items:center;transition:transform .16s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease,color .18s ease}.tool:hover:not(:disabled){background:#414650!important;border-color:#555b67!important;color:#fff!important;transform:translateY(-1px) scale(1.04);box-shadow:0 5px 16px #0005}.tool:active:not(:disabled){transform:scale(.92)}.tool:disabled{opacity:.38;cursor:default}.nav-top .tool{font-size:22px!important;font-weight:600}.tab-count{font-size:10px;color:#e2e7ef;background:#ffffff12;border:1px solid #ffffff1c;border-radius:12px;padding:5px 9px;margin-left:3px;white-space:nowrap;box-shadow:inset 0 1px #fff1}.privacy{margin-left:auto;font-size:9px;color:var(--muted);display:flex;align-items:center;gap:5px;padding:0 5px}.privacy i{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;box-shadow:0 0 9px #42d77d99;animation:statusPulse 2s infinite}.window-btn{width:30px;height:25px;border:0;background:transparent;color:#cbd0d8;border-radius:7px;cursor:pointer;transition:.16s}.window-btn:hover{background:var(--hover);color:#fff}.window-btn.close-win:hover{background:#d33b4d;color:#fff}.tabs{height:35px;display:flex;align-items:stretch;gap:4px;overflow:hidden;padding:0 2px}.tab{height:35px;min-width:165px;max-width:250px;display:flex;align-items:center;gap:8px;background:var(--tab);border:1px solid transparent;border-radius:10px 10px 0 0;padding:0 7px 0 10px;color:#cdd1d8;cursor:pointer;transition:background .2s ease,transform .18s ease,box-shadow .2s ease}.tab:hover{background:#33373f;transform:translateY(-1px)}.tab.active{background:var(--tabActive);color:#fff;border-color:#4d535e;box-shadow:0 -2px 14px #0003;position:relative}.tab.active:after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:linear-gradient(90deg,#6f9dff,#9a7cff);border-radius:2px;animation:tabIn .25s ease}.favicon{width:17px;height:17px;border-radius:6px;display:grid;place-items:center;background:linear-gradient(135deg,#5f6368,#8b93a1);color:#fff;font-size:8px;flex:0 0 auto}.tab-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-size:11px}.close{width:23px;height:23px;border:0;background:transparent;color:#b9bbbf;border-radius:50%;font-size:15px;cursor:pointer;transition:.16s}.close:hover{background:#4b4f57;color:#fff;transform:rotate(90deg)}.add{width:32px;height:30px;align-self:center;border:0;background:#2b2e35;color:#e8ebf0;font-size:21px;border-radius:9px;cursor:pointer;transition:.18s}.add:hover{background:#414650;transform:scale(1.06) rotate(90deg)}.toolbar{height:33px;display:flex;align-items:center;gap:4px;padding:0}.address-wrap{height:32px;flex:1;display:flex;align-items:center;background:#292c33;border:1px solid #383d47;border-radius:18px;margin:0 4px;padding:0 7px 0 11px;box-shadow:inset 0 1px 3px #0007;transition:.2s}.address-wrap:focus-within{background:#30343c;border-color:#6688c7;box-shadow:0 0 0 2px #6688c733,inset 0 1px 3px #0007}.security{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;color:#aeb5c0;font-size:10px;margin-right:3px;background:#ffffff0b}.address{width:100%;height:28px;border:0;outline:0;background:transparent;color:#f1f3f4;font-size:12px;user-select:text}.address::placeholder{color:#9aa0a6}.address-action{width:31px;height:31px;border:1px solid transparent;background:#2b2e35;color:#e7ebf2;font-size:17px;border-radius:50%;cursor:pointer;transition:.18s}.address-action:hover{background:#414650;transform:scale(1.05)}.menu{position:absolute;right:9px;top:69px;width:258px;background:#303136;border:1px solid #56585e;border-radius:12px;padding:7px;display:none;z-index:10000;box-shadow:0 14px 40px #000b}.menu.show{display:block;animation:menuIn .18s ease}.menu-head{padding:9px 10px 8px;font-size:11px;color:#fff;border-bottom:1px solid var(--line);margin-bottom:4px}.menu-head small{float:right;color:var(--muted);font-size:9px}.menu button{display:block;width:100%;text-align:left;background:transparent;color:#f1f3f4;border:0;padding:9px 10px;border-radius:7px;font-size:11px;cursor:pointer}.menu button:hover{background:var(--hover)}.menu kbd{float:right;color:#9aa0a6;font-size:9px;background:#ffffff08;padding:2px 5px;border-radius:4px}.menu-section{font-size:8px;color:#7f8388;padding:8px 10px 4px;text-transform:uppercase;letter-spacing:.8px}.progress{position:absolute;left:0;right:0;bottom:0;height:2px;background:transparent;overflow:hidden}.progress.loading:after{content:"";display:block;width:35%;height:100%;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:load 1s ease-in-out infinite}@keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}@keyframes logoPulse{0%,100%{box-shadow:0 3px 12px #4285f455}50%{box-shadow:0 4px 20px #8b5cf677}}@keyframes statusPulse{0%,100%{opacity:1}50%{opacity:.45}}@keyframes tabIn{from{transform:scaleX(.2);opacity:0}to{transform:scaleX(1);opacity:1}}@keyframes menuIn{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}</style></head><body><div class="browser-shell"><div class="top"><div class="brand"><span class="brand-mark">✦</span>Chrome Pro <span class="pro">PRO</span></div><div class="nav-top" aria-label="Page navigation"><button id="back" class="tool" title="Back (Alt+Left)" aria-label="Back">←</button><button id="forward" class="tool" title="Forward (Alt+Right)" aria-label="Forward">→</button><button id="reload" class="tool" title="Reload" aria-label="Reload">↻</button><span id="tabCount" class="tab-count" aria-live="polite">1 tab</span></div><div class="privacy"><i></i><span>Protected</span></div><button class="window-btn" title="Minimize" aria-label="Minimize">—</button><button class="window-btn" title="Maximize" aria-label="Maximize">□</button><button class="window-btn close-win" title="Close" aria-label="Close">×</button></div><div id="tabs" class="tabs" role="tablist" aria-label="Browser tabs"></div><div class="toolbar"><div class="address-wrap"><span class="security" aria-hidden="true">⌁</span><input id="address" class="address" spellcheck="false" autocomplete="off" placeholder="Search or enter web address" aria-label="Address and search"></div><button id="go" class="address-action" title="Go" aria-label="Go">→</button><button id="bookmark" class="tool" title="Bookmark this page" aria-label="Bookmark">☆</button><button id="incognito" class="tool" title="New Incognito Window" aria-label="New Incognito Window">◐</button><button id="profile" class="tool" title="New Profile" aria-label="New Profile">●</button><button id="menuBtn" class="tool" title="Chrome Pro menu" aria-label="Chrome Pro menu">⋮</button></div><div id="progress" class="progress done" aria-hidden="true"></div></div><div id="menu" class="menu" role="menu"><div class="menu-head"><b>Chrome Pro</b><small>v1.0</small></div><div class="menu-section">Your browser</div><button id="history">History <kbd>Ctrl+H</kbd></button><button id="bookmarks">Bookmarks <kbd>Ctrl+Shift+B</kbd></button><button id="downloads">Downloads</button><div class="menu-section">Privacy</div><button id="clear">Clear site data</button></div><script src="browser-ui.js"></script></body></html>
