<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self';style-src 'self' 'unsafe-inline';script-src 'self'"><meta name="color-scheme" content="dark"><title>Chrome Pro</title><style>:root{--text:#f5f7fa;--accent:#7aa2ff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111317;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}.browser-shell{height:94px;background:linear-gradient(180deg,#24272d,#191c21);border-bottom:1px solid #08090b;box-shadow:0 3px 14px #0009;padding:0 7px;position:relative;z-index:9999}.navrow{height:40px;display:flex;align-items:center;gap:5px}.navrow,.tabs,.toolbar,.navrow button,.tabs button,.toolbar button,.address-wrap,input{-webkit-app-region:no-drag}.nav{width:34px;height:32px;flex:0 0 34px;border:1px solid #4b505a;background:#30343c;color:#fff;border-radius:8px;font-size:20px;cursor:pointer;display:grid;place-items:center;transition:.16s}.nav:hover:not(:disabled){background:#474c56;transform:translateY(-1px)}.nav:disabled{opacity:.55;color:#aeb4bf}.count{font-size:10px;color:#e1e5eb;padding:5px 8px;border:1px solid #ffffff22;border-radius:10px;margin-left:2px;white-space:nowrap}.tabs{height:35px;display:flex;gap:4px;overflow:hidden;flex:1;min-width:0}.tab{height:34px;min-width:150px;max-width:245px;display:flex;align-items:center;gap:7px;padding:0 7px 0 9px;background:#202329;border:1px solid #353a44;border-radius:9px 9px 0 0;color:#cdd1d8;cursor:pointer;transition:.16s}.tab:hover{background:#33373f}.tab.active{background:#343841;border-color:#5b6270;color:#fff;box-shadow:inset 0 1px #ffffff12}.tab-title{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.favicon{width:16px;height:16px;flex:0 0 16px;border-radius:5px;display:grid;place-items:center;background:#5f6368;color:#fff;font-size:8px}.close{width:22px;height:22px;border:0;border-radius:50%;background:transparent;color:#bbb;cursor:pointer}.close:hover{background:#4b4f57;color:#fff}.add{height:30px;width:31px;flex:0 0 31px;border:1px solid #4b505a;border-radius:8px;background:#30343c;color:#fff;font-size:20px;cursor:pointer}.add:hover{background:#474c56}.toolbar{height:54px;display:flex;align-items:center;gap:5px}.address-wrap{height:36px;flex:1;display:flex;align-items:center;background:#292c33;border:1px solid #464c57;border-radius:19px;padding:0 10px;min-width:0}.security{font-size:11px;margin-right:6px}.address{height:30px;width:100%;border:0;outline:0;background:transparent;color:#f1f3f4;font-size:12px;user-select:text}.address::placeholder{color:#9aa0a6}.action{width:34px;height:34px;flex:0 0 34px;border:1px solid #4b505a;border-radius:50%;background:#30343c;color:#fff;cursor:pointer;font-size:17px}.action:hover{background:#474c56;transform:scale(1.04)}.menu{position:absolute;right:7px;top:79px;width:240px;background:#303136;border:1px solid #56585e;border-radius:11px;padding:6px;display:none;z-index:10000;box-shadow:0 14px 40px #000b}.menu.show{display:block}.menu button{display:block;width:100%;text-align:left;background:transparent;color:#f1f3f4;border:0;padding:8px;border-radius:7px;font-size:11px}.menu button:hover{background:#414650}.menu-head{padding:8px;border-bottom:1px solid #3c414b;margin-bottom:3px;font-size:11px}.section{font-size:8px;color:#888;padding:7px 8px 3px;text-transform:uppercase}.progress{position:absolute;left:0;right:0;bottom:0;height:2px;overflow:hidden}.progress.loading:after{content:"";display:block;width:35%;height:100%;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:load 1s infinite}@keyframes load{from{transform:translateX(-120%)}to{transform:translateX(320%)}}</style></head><body><div class="browser-shell"><div class="navrow"><button id="back" class="nav" title="Back">←</button><button id="forward" class="nav" title="Forward">→</button><button id="reload" class="nav" title="Reload">↻</button><span id="tabCount" class="count">1 tab</span><div id="tabs" class="tabs"></div><button id="newTabTop" class="add" title="New tab">+</button></div><div class="toolbar"><div class="address-wrap"><span class="security">🔒</span><input id="address" class="address" spellcheck="false" autocomplete="off" placeholder="Search or enter web address"></div><button id="go" class="action" title="Go">→</button><button id="bookmark" class="action" title="Bookmark">☆</button><button id="incognito" class="action" title="Incognito">◐</button><button id="profile" class="action" title="New Profile">●</button><button id="menuBtn" class="action" title="Menu">⋮</button></div><div id="menu" class="menu"><div class="menu-head"><b>Browser</b></div><div class="section">Your browser</div><button id="history">History</button><button id="bookmarks">Bookmarks</button><button id="downloads">Downloads</button><div class="section">Privacy</div><button id="clear">Clear site data</button></div><div id="progress" class="progress"></div></div><script src="browser-ui.js"></script><script>document.getElementById('newTabTop').onclick=()=>window.chromePro.newTab();</script></body></html>
