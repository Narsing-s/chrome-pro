<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self';style-src 'self' 'unsafe-inline';script-src 'self'"><meta name="color-scheme" content="dark"><title>Chrome Pro</title><style>:root{--text:#f5f7fa;--accent:#7aa2ff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111317;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}.browser-shell{height:94px;background:linear-gradient(180deg,#24272d,#191c21);border-bottom:1px solid #08090b;box-shadow:0 3px 14px #0009;padding:0 7px;position:relative;z-index:9999}.navrow{height:40px;display:flex;align-items:center;gap:5px}.navrow,.tabs,.toolbar,.navrow button,.tabs button,.toolbar button,.address-wrap,input{-webkit-app-region:no-drag}.nav{width:34px;height:32px;flex:0 0 34px;border:1px solid #4b505a;background:#30343c;color:#fff;border-radius:8px;font-size:20px;cursor:pointer}.nav:hover:not(:disabled),.add:hover,.action:hover{background:#474c56}.nav:disabled{opacity:.55;color:#aeb4bf}.count{font-size:10px;color:#e1e5eb;padding:5px 8px;border:1px solid #ffffff22;border-radius:10px;margin-left:2px;white-space:nowrap}.tabs{height:35px;display:flex;gap:4px;overflow:hidden;flex:1;min-width:0}.tab{height:34px;min-width:150px;max-width:245px;display:flex;align-items:center;gap:7px;padding:0 7px 0 9px;background:#202329;border:1px solid #353a44;border-radius:9px 9px 0 0;color:#cdd1d8;cursor:pointer}.tab:hover{background:#33373f}.tab.active{background:#343841;border-color:#5b6270;color:#fff}.tab-title{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.favicon{width:16px;height:16px;flex:0 0 16px;border-radius:5px;display:grid;place-items:center;background:#5f6368;color:#fff;font-size:8px}.close{width:22px;height:22px;border:0;border-radius:50%;background:transparent;color:#bbb;cursor:pointer}.close:hover{background:#4b4f57;color:#fff}.add{height:30px;width:31px;flex:0 0 31px;border:1px solid #4b505a;border-radius:8px;background:#30343c;color:#fff;font-size:20px;cursor:pointer}.toolbar{height:54px;display:flex;align-items:center;gap:5px}.address-wrap{height:36px;flex:1;display:flex;align-items:center;background:#292c33;border:1px solid #464c57;border-radius:19px;padding:0 10px;min-width:0}.security{font-size:11px;margin-right:6px}.address{height:30px;width:100%;border:0;outline:0;background:transparent;color:#f1f3f4;font-size:12px;user-select:text}.address::placeholder{color:#9aa0a6}.action{width:34px;height:34px;flex:0 0 34px;border:1px solid #4b505a;border-radius:50%;background:#30343c;color:#fff;cursor:pointer;font-size:17px}.panel{position:absolute;right:7px;top:42px;width:min(650px,calc(100vw - 20px));max-height:calc(100vh - 55px);background:#202328;border:1px solid #4b515c;border-radius:14px;box-shadow:0 18px 60px #000c;z-index:10001;display:none;overflow:hidden}.panel.show{display:block}.panel-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #3b4048}.panel-head h2{font-size:16px;margin:0;flex:1}.panel-head button,.row button,.folder button{border:1px solid #454b56;background:#2d323a;color:#fff;border-radius:7px;padding:6px 9px;cursor:pointer}.panel-head button:hover,.row button:hover,.folder button:hover{background:#414751}.panel-body{padding:10px;overflow:auto;max-height:calc(100vh - 125px)}.searchbox{width:100%;padding:9px 11px;border-radius:9px;border:1px solid #454b56;background:#15171b;color:#fff;outline:0;margin-bottom:9px}.row{display:flex;align-items:center;gap:10px;padding:9px;border-bottom:1px solid #30343b}.row-main{min-width:0;flex:1}.row-title{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-url{font-size:10px;color:#9299a5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.row-time{font-size:9px;color:#727985}.folder{margin:6px 0;border:1px solid #343a44;border-radius:9px;overflow:hidden}.folder-head{display:flex;align-items:center;gap:7px;padding:8px;background:#292e36}.folder-head strong{flex:1;font-size:11px}.folder-items{padding:0 6px}.empty{padding:25px;text-align:center;color:#8b929d;font-size:12px}.progress{position:absolute;left:0;right:0;bottom:0;height:2px;overflow:hidden}.progress.loading:after{content:"";display:block;width:35%;height:100%;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:load 1s infinite}@keyframes load{from{transform:translateX(-120%)}to{transform:translateX(320%)}}</style></head><body><div class="browser-shell"><div class="navrow"><button id="back" class="nav" title="Back">←</button><button id="forward" class="nav" title="Forward">→</button><button id="reload" class="nav" title="Reload">↻</button><span id="tabCount" class="count">1 tab</span><div id="tabs" class="tabs"></div><button id="newTabTop" class="add" title="New tab">+</button></div><div class="toolbar"><div class="address-wrap"><span class="security">🔒</span><input id="address" class="address" spellcheck="false" autocomplete="off" placeholder="Search or enter web address"></div><button id="go" class="action" title="Go">→</button><button id="bookmark" class="action" title="Save to Favorites">☆</button><button id="incognito" class="action" title="Incognito">◐</button><button id="profile" class="action" title="New Profile">●</button><button id="menuBtn" class="action" title="Menu">⋮</button></div><div id="panel" class="panel"><div class="panel-head"><h2 id="panelTitle">Library</h2><button id="closePanel">Close</button></div><div id="panelBody" class="panel-body"></div></div><div id="progress" class="progress"></div></div><script src="browser-ui.js"></script><script>document.getElementById('newTabTop').onclick=()=>window.chromePro.newTab();</script></body></html>
