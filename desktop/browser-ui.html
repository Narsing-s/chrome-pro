<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self';style-src 'self' 'unsafe-inline';script-src 'self'">
<title>Chrome Pro</title>
<style>
:root{--bg:#202124;--tab:#303134;--tabActive:#35363a;--hover:#3c4043;--text:#e8eaed;--muted:#9aa0a6;--address:#303134;--line:#45464a;--accent:#8ab4f8}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
.browser-shell{height:104px;background:linear-gradient(#292a2d,#242528);border-bottom:1px solid #111214;box-shadow:0 2px 8px #0005;padding:6px 9px 0}
.top{height:34px;display:flex;align-items:center;gap:8px}.brand{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:650;color:#f1f3f4;padding:0 8px}.brand-mark{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#4285f4,#8b5cf6);font-size:10px}.privacy{margin-left:auto;font-size:10px;color:#9aa0a6;display:flex;align-items:center;gap:5px;padding-right:7px}.privacy i{width:6px;height:6px;border-radius:50%;background:#34a853;display:inline-block}.window-btn{width:30px;height:26px;border:0;background:transparent;color:#b9bbbf;border-radius:6px}.window-btn:hover{background:#3c4043;color:white}
.tabs{height:34px;display:flex;align-items:stretch;gap:3px;overflow:hidden}.tab{height:34px;min-width:170px;max-width:260px;display:flex;align-items:center;gap:8px;background:#303134;border:1px solid transparent;border-radius:9px 9px 0 0;padding:0 8px 0 11px;color:#c9cacc;cursor:pointer;box-shadow:inset 0 -1px #202124}.tab:hover{background:#3a3b3f}.tab.active{background:#35363a;color:#fff;border-color:#45464a;box-shadow:none}.favicon{width:15px;height:15px;border-radius:50%;display:grid;place-items:center;background:#5f6368;color:#fff;font-size:8px;flex:0 0 auto}.tab-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-size:11px}.close{width:24px;height:24px;border:0;background:transparent;color:#b9bbbf;border-radius:50%;font-size:16px;cursor:pointer}.close:hover{background:#4a4b4f;color:#fff}.add{width:34px;height:30px;align-self:center;border:0;background:transparent;color:#d5d7da;font-size:22px;border-radius:50%;cursor:pointer}.add:hover{background:#3c4043}
.toolbar{height:36px;display:flex;align-items:center;gap:2px;padding:0}.tool{width:31px;height:30px;border:0;background:transparent;color:#bdc1c6;border-radius:50%;font-size:19px;cursor:pointer;display:grid;place-items:center}.tool:hover{background:#3c4043;color:#fff}.tool:disabled{opacity:.35}.address-wrap{height:32px;flex:1;display:flex;align-items:center;background:var(--address);border:1px solid transparent;border-radius:18px;margin:0 7px;padding:0 7px 0 12px;box-shadow:inset 0 1px 1px #0003}.address-wrap:focus-within{background:#3c4043;border-color:#6b7075;box-shadow:0 0 0 1px #8ab4f8}.security{font-size:12px;color:#9aa0a6;margin-right:8px}.address{width:100%;height:28px;border:0;outline:0;background:transparent;color:#e8eaed;font-size:12px}.address::placeholder{color:#9aa0a6}.address-action{border:0;background:transparent;color:#9aa0a6;font-size:16px;cursor:pointer}.address-action:hover{color:#fff}.hint{font-size:9px;color:#74777b;padding:2px 5px 0 9px;white-space:nowrap}.menu{position:absolute;right:12px;top:76px;width:250px;background:#303134;border:1px solid #5f6368;border-radius:12px;padding:7px;display:none;z-index:100;box-shadow:0 12px 35px #0009}.menu.show{display:block}.menu-head{padding:9px 10px 7px;font-size:11px;color:#e8eaed;border-bottom:1px solid #45464a;margin-bottom:4px}.menu button{display:block;width:100%;text-align:left;background:transparent;color:#f1f3f4;border:0;padding:9px 10px;border-radius:7px;font-size:11px;cursor:pointer}.menu button:hover{background:#3c4043}.menu kbd{float:right;color:#9aa0a6;font-size:9px}
</style>
</head>
<body>
<div class="browser-shell">
  <div class="top">
    <div class="brand"><span class="brand-mark">◉</span>Chrome Pro <span style="color:#8ab4f8">PRO</span></div>
    <div class="privacy"><i></i> Protected session</div>
    <button class="window-btn" title="Minimize">—</button><button class="window-btn" title="Maximize">□</button><button class="window-btn" title="Close">×</button>
  </div>
  <div id="tabs" class="tabs"></div>
  <div class="toolbar">
    <button id="back" class="tool" title="Back">‹</button><button id="forward" class="tool" title="Forward">›</button><button id="reload" class="tool" title="Reload">↻</button>
    <div class="address-wrap"><span class="security">⌁</span><input id="address" class="address" spellcheck="false" placeholder="Search or enter web address"><button id="go" class="address-action" title="Go">→</button></div>
    <button id="bookmark" class="tool" title="Bookmark">☆</button><button id="incognito" class="tool" title="New Incognito Window">◐</button><button id="profile" class="tool" title="New Profile">●</button><button id="menuBtn" class="tool" title="Chrome Pro menu">⋮</button>
  </div>
</div>
<div id="menu" class="menu"><div class="menu-head"><b>Chrome Pro</b><span style="float:right;color:#9aa0a6">v1.0</span></div><button id="history">History <kbd>Ctrl+H</kbd></button><button id="bookmarks">Bookmarks <kbd>Ctrl+Shift+B</kbd></button><button id="downloads">Downloads</button><button id="clear">Clear site data</button></div>
<script src="browser-ui.js"></script>
</body>
</html>
