<!doctype html>
<html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'"><title>Chrome Pro</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#202124;color:#e8eaed}.bar{height:92px;background:#292a2d;padding:8px 12px}.tabs{height:34px;display:flex;gap:6px}.tab{background:#3c4043;border-radius:9px 9px 0 0;padding:7px 16px;min-width:150px}.tools{display:flex;gap:8px;align-items:center}.tools button{background:transparent;color:#e8eaed;border:0;font-size:18px;padding:7px;border-radius:50%}.tools button:hover{background:#3c4043}.address{flex:1;height:38px;border:0;border-radius:20px;background:#202124;color:white;padding:0 16px;font-size:15px;outline:none}.hint{font-size:12px;color:#9aa0a6;margin:4px 12px}</style></head><body><div class="bar"><div class="tabs"><div class="tab">New Tab</div><button onclick="newTab()">＋</button></div><div class="tools"><button onclick="history.back()">‹</button><button onclick="history.forward()">›</button><button onclick="location.reload()">↻</button><input id="address" class="address" placeholder="Search or enter web address" onkeydown="if(event.key==='Enter')go()"><button onclick="bookmark()">☆</button><button onclick="newProfile()">●</button></div><div class="hint">Chrome Pro • Chromium-powered desktop browser</div></div><script>function go(){const u=document.getElementById('address').value;window.chromePro?.open(u)}function newTab(){window.chromePro?.open('https://chrome-pro.vercel.app')}function newProfile(){window.chromePro?.newProfile('profile-'+Date.now())}function bookmark(){alert('Bookmark saved for this page.')}</script></body></html>
